<template id="tpl-marks-management">
  <div class="page-container">
    <header class="flex-between">
      <div>
        <div class="flex-row">
          <h1 class="page-title" data-el="page-title"></h1>
          <span class="badge badge-primary">Assessment Analytics</span>
        </div>
        <p class="page-subtitle">Question-wise scoring, CSV/Excel import, automated total verification, and AI-suggested vs teacher-approved audit trail.</p>
      </div>

      <div class="flex-row">
        <button type="button" id="btn-open-marks-import" class="btn btn-surface">
          <span class="material-symbols-outlined" style="font-size:1rem;">upload_file</span>
          <span data-el="import-label"></span>
        </button>
        <button type="button" id="btn-export-dge" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:1rem;">file_download</span>
          <span data-el="export-label"></span>
        </button>
      </div>
    </header>

    <div class="card flex-between">
      <div class="flex-row">
        <label class="text-xs" style="font-weight:700;" data-el="assess-label"></label>
        <select id="marks-assess-select" class="select" style="width:auto;min-width:18rem;">
          <option value="UT1">Unit Test 1 — Matrices &amp; Determinants</option>
          <option value="UT2">Unit Test 2 — Complex Numbers &amp; Equations</option>
          <option value="MID">Mid-Term Examination (50M)</option>
          <option value="REV">Revision Test 1 (Full Vol 1)</option>
        </select>
      </div>
      <div class="flex-row text-xs muted" style="gap:1rem;">
        <span><span data-el="cohort-label"></span> <strong style="color:var(--on-surface);" data-el="cohort-val"></strong></span>
        <span><span data-el="avg-label"></span> <strong id="marks-avg-val" style="color:var(--secondary);"></strong></span>
        <span><span data-el="flags-label"></span> <strong style="color:var(--error);" data-el="flags-val"></strong></span>
      </div>
    </div>

    <section class="card" style="padding:0;overflow:hidden;">
      <div class="flex-between" style="padding:0.75rem 1rem;background:rgba(242,243,255,0.6);border-bottom:1px solid var(--surface-container);">
        <strong class="text-xs" data-el="ledger-title"></strong>
        <span class="text-xs muted" data-el="ledger-hint"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Student Name</th>
              <th style="text-align:center;">Q.1 (1M)</th>
              <th style="text-align:center;">Q.2 (2M)</th>
              <th style="text-align:center;">Q.3 (3M)</th>
              <th style="text-align:center;">Q.4 (5M)</th>
              <th style="text-align:center;">Q.5 (5M)</th>
              <th style="text-align:center;">Total (16M)</th>
              <th>Audit Status / Flags</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody data-el="ledger-tbody"></tbody>
        </table>
      </div>
    </section>

    <div id="marks-import-backdrop" class="modal-backdrop" hidden>
      <div class="modal-card" style="max-width:28rem;">
        <div class="flex-between" style="padding-bottom:0.65rem;border-bottom:1px solid var(--surface-container);">
          <h2 style="margin:0;font-size:1rem;font-weight:700;">Batch Import Marks Spreadsheet</h2>
          <button type="button" id="btn-close-marks-import" class="btn-ghost" style="padding:0.25rem;"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="soft-panel" style="border:2px dashed var(--outline-variant);text-align:center;padding:1.4rem;margin-top:0.9rem;">
          <span class="material-symbols-outlined" style="color:var(--primary);font-size:2rem;">table_view</span>
          <div class="text-xs" style="font-weight:700;margin-top:0.25rem;">Upload CSV or XLSX file</div>
          <div class="text-xs muted">Columns: RollNo, Q1, Q2, Q3, Q4, Q5</div>
        </div>
        <div class="badge badge-secondary" style="margin-top:0.85rem;padding:0.6rem 0.75rem;border-radius:0.75rem;white-space:normal;">
          <span class="material-symbols-outlined fill" style="font-size:1rem;">verified</span>
          <span>Automatic total recalculation and discrepancy matching against EMIS roster.</span>
        </div>
        <div class="flex-row" style="justify-content:flex-end;margin-top:1rem;">
          <button type="button" id="btn-cancel-marks-import" class="btn btn-surface">Cancel</button>
          <button type="button" id="btn-exec-marks-import" class="btn btn-primary">Execute Import</button>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-marks-row">
  <tr>
    <td class="font-mono" style="font-weight:700;color:var(--primary);" data-el="roll"></td>
    <td><strong data-el="name"></strong></td>
    <td style="text-align:center;"><input type="number" min="0" max="1" class="input" style="width:3rem;padding:0.3rem;text-align:center;" data-field="q1" /></td>
    <td style="text-align:center;"><input type="number" min="0" max="2" class="input" style="width:3rem;padding:0.3rem;text-align:center;" data-field="q2" /></td>
    <td style="text-align:center;"><input type="number" min="0" max="3" class="input" style="width:3rem;padding:0.3rem;text-align:center;" data-field="q3" /></td>
    <td style="text-align:center;"><input type="number" min="0" max="5" class="input" style="width:3rem;padding:0.3rem;text-align:center;" data-field="q4" /></td>
    <td style="text-align:center;"><input type="number" min="0" max="5" class="input" style="width:3rem;padding:0.3rem;text-align:center;" data-field="q5" /></td>
    <td style="text-align:center;">
      <strong style="font-size:0.95rem;color:var(--primary);" data-el="total"></strong>
      <span class="text-xs muted">/ 16</span>
    </td>
    <td>
      <span class="badge badge-error" data-el="flag-badge" hidden>
        <span class="material-symbols-outlined" style="font-size:0.8rem;">flag</span>
        <span data-el="flag-text"></span>
      </span>
      <span style="color:var(--secondary);font-weight:700;display:inline-flex;align-items:center;gap:0.25rem;" data-el="verified-badge" hidden>
        <span class="material-symbols-outlined" style="font-size:0.9rem;">check_circle</span>Verified
      </span>
    </td>
    <td style="text-align:right;">
      <button type="button" class="btn btn-ghost" style="color:var(--primary);padding:0.25rem 0.5rem;" data-el="audit-btn">Audit Slip →</button>
    </td>
  </tr>
</template>
