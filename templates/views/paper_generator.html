<template id="tpl-paper-generator">
  <div class="page-container">
    <header class="flex-between" style="align-items:flex-start;">
      <div>
        <div class="flex-row">
          <h1 class="page-title" data-el="page-title"></h1>
          <span class="badge badge-primary">HSC Blueprint Engine</span>
          <span class="badge badge-secondary" data-el="ai-status-badge" hidden></span>
        </div>
        <p class="page-subtitle">Automated examination authoring conforming strictly to the 5-Year Past Exam Archive (2021–2025) and Rule 1 Teaching Progress Lock.</p>
      </div>

      <div class="flex-row no-print" style="justify-content:flex-end;gap:0.5rem;" data-el="export-actions" hidden>
        <button type="button" id="btn-export-pdf" class="btn btn-primary" title="Download High-Fidelity PDF with Noto Sans Tamil">
          <span class="material-symbols-outlined" style="font-size:1rem;">picture_as_pdf</span>
          <span>Download PDF</span>
        </button>
        <button type="button" id="btn-export-pdf-key" class="btn btn-secondary" title="Download Official Stepwise Marking Scheme PDF">
          <span class="material-symbols-outlined" style="font-size:1rem;">verified</span>
          <span>Answer Key PDF</span>
        </button>
        <button type="button" id="btn-export-docx" class="btn btn-surface" title="Download Editable Microsoft Word DOCX">
          <span class="material-symbols-outlined" style="font-size:1rem;">description</span>
          <span>Word (.docx)</span>
        </button>
        <button type="button" id="btn-print-paper" class="btn btn-ghost" title="Print Examination Sheet">
          <span class="material-symbols-outlined" style="font-size:1rem;">print</span>
        </button>
      </div>
    </header>

    <div class="card flex-between no-print" data-el="lock-banner">
      <div class="flex-row" style="gap:0.75rem;">
        <span class="material-symbols-outlined" style="font-size:1.6rem;" data-el="lock-banner-icon"></span>
        <div>
          <div class="text-xs" style="font-weight:700;" data-el="lock-banner-title"></div>
          <div class="text-xs muted" data-el="lock-banner-desc"></div>
        </div>
      </div>
      <span class="badge font-mono" data-el="lock-banner-badge"></span>
    </div>

    <!-- Fallback / Notice Banner -->
    <div class="card no-print" data-el="fallback-banner" style="background:rgba(255,185,95,0.18);border-color:var(--tertiary);margin-bottom:0.25rem;" hidden>
      <div class="flex-row" style="gap:0.75rem;">
        <span class="material-symbols-outlined" style="color:var(--tertiary);">info</span>
        <div class="text-xs" style="color:var(--on-surface);">
          <strong>Offline Dataset Generation Mode Active:</strong> Examination synthesized directly from verified 5-year DGE past question papers with deterministic marking schemes.
        </div>
      </div>
    </div>

    <div class="grid grid-12" style="gap:1.25rem;align-items:start;">
      <!-- Left Column: Controls & Dataset Status -->
      <div class="card col-span-4 flex-col no-print" style="gap:0.9rem;">
        <h2 class="section-title" style="padding-bottom:0.55rem;border-bottom:1px solid var(--surface-container);">Blueprint &amp; Examination Settings</h2>

        <div>
          <label class="field-label" for="pg-subject">Target Subject (பாடப் பிரிவு)</label>
          <select id="pg-subject" class="select font-mono" style="font-weight:600;">
            <option value="Physics">Physics (இயற்பியல்)</option>
            <option value="Chemistry">Chemistry (வேதியியல்)</option>
            <option value="Commerce">Commerce (வணிகவியல்)</option>
            <option value="Accountancy">Accountancy (கணக்குப்பதிவியல்)</option>
            <option value="Computer Science">Computer Science (கணினி அறிவியல்)</option>
            <option value="Computer Applications">Computer Applications (கணினி பயன்பாடுகள்)</option>
            <option value="Automobile Technology">Automobile Technology (தானியங்கி ஊர்தி தொழில்.)</option>
          </select>
        </div>

        <div>
          <label class="field-label" data-el="label-title"></label>
          <input id="pg-title" class="input" />
        </div>

        <div class="grid grid-2" style="gap:0.65rem;">
          <div>
            <label class="field-label" data-el="label-marks"></label>
            <select id="pg-marks" class="select">
              <option value="25">25 Marks (Unit Test)</option>
              <option value="50">50 Marks (Mid-Term)</option>
              <option value="70">70 Marks (Board Pattern)</option>
              <option value="90">90 Marks (Commerce/Acc)</option>
              <option value="100">100 Marks (Full Test)</option>
            </select>
          </div>
          <div>
            <label class="field-label" data-el="label-duration"></label>
            <select id="pg-duration" class="select">
              <option value="45">45 Minutes</option>
              <option value="60">60 Minutes</option>
              <option value="90">90 Minutes (1.5 Hours)</option>
              <option value="150">150 Minutes (2.5 Hours)</option>
              <option value="180">180 Minutes (3.0 Hours)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="field-label" for="pg-language" data-el="label-language"></label>
          <select id="pg-language" class="select">
            <option value="bilingual">Bilingual (English &amp; தமிழ்)</option>
            <option value="en">English Only</option>
            <option value="ta">தமிழ் Only (Tamil Medium)</option>
          </select>
        </div>

        <div>
          <div class="flex-between text-xs" style="margin-bottom:0.25rem;">
            <strong>Book-Back Questions Ratio</strong>
            <strong class="font-mono" style="color:var(--primary);" id="pg-ratio-label">60%</strong>
          </div>
          <input id="pg-ratio" type="range" min="20" max="90" step="10" style="width:100%;accent-color:var(--primary);" />
          <div class="flex-between" style="font-size:0.68rem;color:var(--outline);">
            <span>20% (More HOTS)</span>
            <span>60% (TN Average)</span>
            <span>90% (Foundation)</span>
          </div>
        </div>

        <label class="soft-panel flex-row" style="align-items:flex-start;flex-wrap:nowrap;cursor:pointer;">
          <input id="pg-public" type="checkbox" style="margin-top:0.2rem;" checked />
          <div class="text-xs">
            <strong>Draw from 5-Year Public Exam Papers</strong>
            <div class="muted" style="font-size:0.7rem;">Prioritize verified questions from 2021–2025 archive</div>
          </div>
        </label>

        <button type="button" id="btn-generate-paper" class="btn btn-primary" style="width:100%;padding:0.75rem;">
          <span class="spinner" data-el="gen-spinner" hidden></span>
          <span class="material-symbols-outlined" style="font-size:1.05rem;" data-el="gen-icon">auto_awesome</span>
          <span data-el="gen-label"></span>
        </button>

        <!-- Dataset Status Panel -->
        <div class="card" style="padding:0.75rem 0.9rem;background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:0.75rem;margin-top:0.4rem;" data-el="dataset-status-panel">
          <div class="flex-between" style="margin-bottom:0.4rem;">
            <div class="flex-row" style="gap:0.4rem;">
              <span class="material-symbols-outlined" style="font-size:1rem;color:var(--primary);">library_books</span>
              <strong class="text-xs">Past Paper Dataset Status</strong>
            </div>
            <span class="badge badge-secondary" style="font-size:0.65rem;" data-el="ds-status-badge">35/35 PDFs Ready</span>
          </div>
          <div class="text-xs muted" style="font-size:0.72rem;line-height:1.4;" data-el="ds-stats-summary">
            Loading past paper archive statistics...
          </div>
          <div class="grid grid-5" style="gap:0.25rem;margin-top:0.4rem;text-align:center;" data-el="ds-year-pills"></div>
        </div>
      </div>

      <!-- Right Column: Question Paper & Rubric Preview -->
      <div class="col-span-8">
        <div class="card" style="padding:3rem 1.5rem;text-align:center;min-height:26rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.75rem;" data-el="empty-state" hidden>
          <div style="width:4rem;height:4rem;border-radius:1rem;background:var(--primary-fixed);color:var(--primary);display:flex;align-items:center;justify-content:center;">
            <span class="material-symbols-outlined" style="font-size:2rem;">assignment_add</span>
          </div>
          <h3 style="margin:0;font-size:1.05rem;">Ready to Generate Examination</h3>
          <p class="text-xs muted" style="max-width:26rem;margin:0;line-height:1.5;">
            Configure subject, duration, and marks on the left. Click "Generate Test Paper" to synthesize an authentic TN State Board question paper from the 2021–2025 archive.
          </p>
          <button type="button" id="btn-quick-demo-paper" class="btn btn-primary" style="margin-top:0.4rem;"></button>
        </div>

        <!-- Generating Progress Stepper -->
        <div class="card" style="padding:3.5rem 1.5rem;text-align:center;min-height:26rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;" data-el="loading-state" hidden>
          <span class="spinner spinner-lg"></span>
          <div>
            <div style="font-size:1.05rem;font-weight:700;" data-el="loading-title">Synthesizing Examination...</div>
            <div class="text-xs muted" style="margin-top:0.25rem;" data-el="loading-subtitle">Querying 5-year past question paper database (1,361 questions)</div>
          </div>
          <div class="flex-col" style="gap:0.5rem;max-width:22rem;width:100%;text-align:left;">
            <div class="flex-row text-xs" style="gap:0.5rem;" data-el="step-1">
              <span class="material-symbols-outlined" style="font-size:1.1rem;color:var(--secondary);" data-el="step-1-icon">check_circle</span>
              <span>1. Validating against Teaching Progress Lock</span>
            </div>
            <div class="flex-row text-xs" style="gap:0.5rem;" data-el="step-2">
              <span class="material-symbols-outlined" style="font-size:1.1rem;color:var(--secondary);" data-el="step-2-icon">check_circle</span>
              <span>2. 5-Year Weighted Sampling (2021–2025 cap ≤35%)</span>
            </div>
            <div class="flex-row text-xs" style="gap:0.5rem;" data-el="step-3">
              <span class="material-symbols-outlined" style="font-size:1.1rem;color:var(--secondary);" data-el="step-3-icon">check_circle</span>
              <span>3. Applying Difficulty &amp; Book-Back Ratios</span>
            </div>
            <div class="flex-row text-xs" style="gap:0.5rem;" data-el="step-4">
              <span class="material-symbols-outlined" style="font-size:1.1rem;color:var(--secondary);" data-el="step-4-icon">check_circle</span>
              <span>4. Generating Bilingual Texts &amp; Marking Schemes</span>
            </div>
          </div>
        </div>

        <!-- Paper Display Card -->
        <div class="card" style="padding:0;overflow:hidden;" data-el="paper-card" hidden>
          <div class="flex-between no-print" style="padding:0.75rem 1rem;border-bottom:1px solid var(--surface-container);background:rgba(242,243,255,0.5);flex-wrap:wrap;gap:0.5rem;">
            <div class="segmented-pill">
              <button type="button" id="tab-paper-view" class="segmented-btn">Question Paper View</button>
              <button type="button" id="tab-rubric-view" class="segmented-btn">Official Marking Scheme &amp; Answer Keys</button>
            </div>
            <div class="flex-row" style="gap:0.6rem;">
              <div class="flex-row text-xs" style="gap:0.25rem;">
                <span class="muted">View:</span>
                <button type="button" class="btn-ghost" id="btn-toggle-bilingual" style="padding:0.2rem 0.4rem;font-size:0.72rem;">Bilingual</button>
                <button type="button" class="btn-ghost" id="btn-toggle-en" style="padding:0.2rem 0.4rem;font-size:0.72rem;">English</button>
                <button type="button" class="btn-ghost" id="btn-toggle-ta" style="padding:0.2rem 0.4rem;font-size:0.72rem;">தமிழ்</button>
              </div>
              <span class="font-mono text-xs muted" data-el="paper-id"></span>
            </div>
          </div>

          <!-- Coverage Report Summary Strip -->
          <div class="no-print" style="padding:0.65rem 1.25rem;background:var(--surface-container-highest);border-bottom:1px solid var(--outline-variant);" data-el="coverage-strip">
            <div class="flex-between" style="flex-wrap:wrap;gap:0.5rem;font-size:0.75rem;">
              <div class="flex-row" style="gap:0.8rem;">
                <span><strong>Archive Distribution:</strong> <span data-el="cov-years">-</span></span>
                <span><strong>Book-Back:</strong> <span class="font-mono" data-el="cov-bb">-</span></span>
                <span><strong>Difficulty:</strong> <span data-el="cov-diff">-</span></span>
              </div>
              <div class="flex-row" style="gap:0.4rem;">
                <span class="badge badge-secondary" style="font-size:0.68rem;" data-el="cov-rule1-badge">Rule 1 Enforced</span>
                <span class="badge badge-primary" style="font-size:0.68rem;" data-el="cov-cap-badge">Max Year Cap &le; 35%</span>
              </div>
            </div>
          </div>

          <!-- Question Paper Pane -->
          <div style="padding:1.75rem;display:flex;flex-direction:column;gap:1.35rem;" data-el="paper-pane" hidden>
            <div style="text-align:center;padding-bottom:1rem;border-bottom:2px solid var(--on-surface);">
              <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--outline);">
                GOVERNMENT OF TAMIL NADU • DEPARTMENT OF SCHOOL EDUCATION
              </div>
              <h2 style="margin:0.3rem 0;font-size:1.15rem;font-weight:800;" data-el="paper-title"></h2>
              <div class="text-xs muted" style="font-weight:600;" data-el="paper-meta"></div>
            </div>
            <div class="flex-col" style="gap:1.35rem;" data-el="paper-sections"></div>
          </div>

          <!-- Marking Scheme Pane -->
          <div style="padding:1.5rem;display:flex;flex-direction:column;gap:0.9rem;" data-el="rubric-pane" hidden>
            <div class="badge badge-secondary" style="padding:0.65rem 0.85rem;border-radius:0.75rem;">
              <span class="material-symbols-outlined fill" style="font-size:1rem;">verified</span>
              <span>Official Stepwise Scoring Rubrics for Evaluators according to DGE TN Guidelines.</span>
            </div>
            <div class="flex-col" style="gap:0.9rem;" data-el="rubric-sections"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-pg-section">
  <div class="flex-col" style="gap:0.8rem;">
    <div class="soft-panel flex-between" style="padding:0.45rem 0.8rem;">
      <strong class="text-xs" style="text-transform:uppercase;" data-el="sec-name"></strong>
      <span class="text-xs muted" style="font-style:italic;" data-el="sec-instructions"></span>
    </div>
    <div class="flex-col" style="gap:0.8rem;" data-el="sec-questions"></div>
  </div>
</template>

<template id="tpl-pg-question">
  <div style="padding-left:0.4rem;padding-bottom:0.4rem;border-bottom:1px dashed var(--surface-container-high);">
    <div class="flex-between" style="align-items:flex-start;flex-wrap:nowrap;">
      <div class="flex-row" style="align-items:flex-start;flex-wrap:nowrap;flex:1;">
        <strong class="text-xs" style="min-width:1.5rem;" data-el="q-no"></strong>
        <div class="flex-col" style="gap:0.25rem;flex:1;">
          <div class="text-xs" style="white-space:pre-line;" data-el="q-en" hidden></div>
          <div class="text-xs font-tamil muted" style="white-space:pre-line;" data-el="q-ta" hidden></div>
          <div class="grid grid-4" style="gap:0.4rem;margin-top:0.25rem;" data-el="q-options" hidden></div>
        </div>
      </div>
      <div class="flex-col" style="align-items:flex-end;gap:0.2rem;">
        <strong class="text-xs" data-el="q-marks"></strong>
        <span class="badge" style="font-size:0.65rem;" data-el="q-source-badge"></span>
      </div>
    </div>
    <div class="flex-row no-print" style="padding-left:1.5rem;margin-top:0.35rem;font-size:0.7rem;gap:0.5rem;">
      <button type="button" class="btn-ghost" style="border:none;padding:0.15rem 0.35rem;color:var(--primary);" data-el="btn-swap">
        <span class="material-symbols-outlined" style="font-size:0.85rem;">sync</span> Swap question
      </button>
      <button type="button" class="btn-ghost" style="border:none;padding:0.15rem 0.35rem;" data-el="btn-lock">
        <span class="material-symbols-outlined" style="font-size:0.85rem;" data-el="lock-icon"></span>
        <span data-el="lock-text"></span>
      </button>
      <span class="text-xs muted" style="font-size:0.68rem;" data-el="q-chapter-tag"></span>
    </div>
  </div>
</template>

<template id="tpl-pg-mcq-opt">
  <div class="soft-panel font-mono" style="padding:0.3rem 0.5rem;font-size:0.7rem;" data-el="opt-text"></div>
</template>

<template id="tpl-pg-rubric-section">
  <div class="card" style="box-shadow:none;">
    <div class="text-xs" style="font-weight:700;color:var(--primary);margin-bottom:0.5rem;text-transform:uppercase;" data-el="sec-name"></div>
    <div class="flex-col" style="gap:0.4rem;" data-el="rubric-rows"></div>
  </div>
</template>

<template id="tpl-pg-rubric-row">
  <div class="flex-between text-xs" style="padding:0.35rem 0;border-bottom:1px solid var(--surface-container-low);gap:0.75rem;">
    <span style="flex:1;"><strong data-el="q-no"></strong> <span data-el="q-detail"></span></span>
    <strong class="font-mono" style="color:var(--secondary);" data-el="q-marks"></strong>
  </div>
</template>
